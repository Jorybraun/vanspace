<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" role="img" aria-label="van space .dev">
  <title>vanspace.dev — van [spacebar] .dev</title>
  <!-- Spacebar key is geometric center of the viewBox (x=170) so overlays land on the crab -->
  <defs>
    <style>
      .van { font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, monospace; font-size: 28px; font-weight: 500; fill: #1A1A1A; letter-spacing: -0.02em; }
      .dev { font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, monospace; font-size: 28px; font-weight: 500; fill: #1A1A1A; letter-spacing: -0.02em; }
      .key-label { font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, monospace; font-size: 11px; font-weight: 500; fill: #8B8499; letter-spacing: 0.14em; }
    </style>
  </defs>
  <!-- "van" right-aligned into the key -->
  <text class="van" x="78" y="38" text-anchor="end">van</text>
  <!-- Spacebar: 168 wide, centered at 170 → origin 86 -->
  <g transform="translate(86, 10)">
    <rect x="1" y="3" width="168" height="36" rx="6" fill="#1A1A1A" opacity="0.08"/>
    <rect x="0" y="0" width="168" height="36" rx="6" fill="#F4F0E8" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M8 8h152" stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="1" stroke-linecap="round"/>
    <text class="key-label" x="84" y="23" text-anchor="middle">space</text>
  </g>
  <!-- ".dev" left-aligned out of the key -->
  <text class="dev" x="262" y="38" text-anchor="start">.dev</text>
</svg>
