<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VanSpace mark">
  <title>VanSpace — spacebar mark</title>
  <!-- App icon / favicon: just the spacebar key -->
  <rect width="64" height="64" rx="12" fill="#F4F0E8"/>
  <!-- spacebar -->
  <rect x="8" y="26" width="48" height="16" rx="4" fill="#F4F0E8" stroke="#1A1A1A" stroke-width="1.75"/>
  <text x="32" y="37.5" text-anchor="middle"
    font-family="ui-monospace, IBM Plex Mono, SF Mono, Menlo, monospace"
    font-size="7" font-weight="500" fill="#8B8499" letter-spacing="0.12em">space</text>
</svg>
