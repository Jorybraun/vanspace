<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" role="img" aria-labelledby="bios-title bios-desc">
  <title id="bios-title">BIOS SPHERE</title>
  <desc id="bios-desc">The words BIOS and SPHERE separated by a geometric line drawing of the Science World dome.</desc>
  <defs>
    <clipPath id="dome-clip">
      <circle cx="50" cy="42" r="39" />
    </clipPath>
    <style>
      .word {
        fill: #fff;
        font-family: "IBM Plex Sans", Arial, sans-serif;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -2.4px;
      }
      .dome-line {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.45;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <text class="word" x="0" y="61">BIOS</text>

  <!-- Science World: a compact geodesic dome, drawn as architecture rather than a generic planet. -->
  <g transform="translate(146 3)" aria-hidden="true">
    <circle class="dome-line" cx="50" cy="42" r="39" stroke-width="2" />
    <g class="dome-line" clip-path="url(#dome-clip)">
      <path d="M11 42H89 M15 27H85 M15 57H85 M24 15H76 M24 69H76" />
      <path d="M50 3V81 M50 3C34 14 28 27 28 42s6 28 22 39 M50 3c16 11 22 24 22 39s-6 28-22 39" />
      <path d="M11 42L35 3M11 42l26 39M89 42L65 3M89 42L63 81" />
      <path d="M15 27L50 3l35 24-35 15-35-15Zm0 30 35-15 35 15-35 24-35-24Z" />
      <path d="M24 15l26 27 26-27M24 69l26-27 26 27" />
    </g>
    <path class="dome-line" d="M7 81H93 M19 81v7h62v-7 M29 88h42" stroke-width="2" />
  </g>

  <text class="word" x="253" y="61">SPHERE</text>
</svg>
