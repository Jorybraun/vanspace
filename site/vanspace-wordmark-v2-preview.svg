<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="Van Space dot dev logo in primary and reverse colorways">
  <style>
    .domain {
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 61px;
      font-weight: 700;
      letter-spacing: -2.7px;
    }
    .key-label {
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 5px;
    }
  </style>

  <rect width="1400" height="400" fill="#e5e0cf" />
  <rect y="400" width="1400" height="400" fill="#170073" />

  <g transform="translate(110 88) scale(1.966667 2)" fill="#170073">
    <text class="domain" x="8" y="77">van</text>
    <g transform="translate(120 20)">
      <rect x="3" y="5" width="276" height="68" rx="9" opacity=".16" />
      <rect x="0" y="0" width="276" height="68" rx="9" fill="#e5e0cf" stroke="#170073" stroke-width="2.5" />
      <path d="M13 12H263" fill="none" stroke="#170073" stroke-linecap="round" stroke-opacity=".16" stroke-width="1.5" />
      <path d="M17 56H259" fill="none" stroke="#170073" stroke-linecap="round" stroke-opacity=".08" />
      <text class="key-label" x="140.5" y="42" text-anchor="middle">SPACE</text>
    </g>
    <text class="domain" x="419" y="77">.dev</text>
  </g>

  <g transform="translate(110 488) scale(1.966667 2)" fill="#fff">
    <text class="domain" x="8" y="77">van</text>
    <g transform="translate(120 20)">
      <rect x="3" y="5" width="276" height="68" rx="9" opacity=".18" />
      <rect x="0" y="0" width="276" height="68" rx="9" fill="#170073" stroke="#fff" stroke-width="2.5" />
      <path d="M13 12H263" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".28" stroke-width="1.5" />
      <path d="M17 56H259" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".16" />
      <text class="key-label" x="140.5" y="42" text-anchor="middle">SPACE</text>
    </g>
    <text class="domain" x="419" y="77">.dev</text>
