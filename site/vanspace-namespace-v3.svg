<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-labelledby="namespace-title namespace-desc">
  <title id="namespace-title">VAN:SPACE dot dev</title>
  <desc id="namespace-desc">Van Space rendered as a developer namespace, with a two-pixel colon and dot dev terminal tag.</desc>
  <style>
    .word {
      fill: #170073;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 82px;
      font-weight: 700;
      letter-spacing: -3.5px;
    }
    .suffix {
      fill: #170073;
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 2.5px;
    }
  </style>

  <text class="word" x="10" y="106">VAN</text>

  <!-- A geometric colon turns the name into a developer-style namespace. -->
  <g fill="#170073" aria-hidden="true">
    <rect x="190" y="47" width="15" height="15" rx="1.5" />
    <rect x="190" y="86" width="15" height="15" rx="1.5" />
  </g>

  <text class="word" x="226" y="106">SPACE</text>

  <g transform="translate(541 20)" aria-hidden="true">
    <rect x="2.5" y="3.5" width="132" height="40" rx="5" fill="#170073" opacity=".14" />
    <rect x="0" y="0" width="132" height="40" rx="5" fill="#e5e0cf" stroke="#170073" stroke-width="2" />
    <text class="suffix" x="68" y="26" text-anchor="middle">.DEV</text>
  </g>

  <path d="M226 124H673" fill="none" stroke="#170073" stroke-width="2" stroke-linecap="square" />
  <rect x="663" y="117" width="10" height="14" fill="#170073" />
</svg>
