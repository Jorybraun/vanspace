<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 112" role="img" aria-labelledby="vanspace-title vanspace-desc">
  <title id="vanspace-title">Van Space dot dev</title>
  <desc id="vanspace-desc">The word van, a keyboard spacebar labelled SPACE, and dot dev.</desc>
  <style>
    .domain {
      fill: #170073;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 61px;
      font-weight: 700;
      letter-spacing: -2.7px;
    }
    .key-label {
      fill: #170073;
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 5px;
    }
  </style>

  <text class="domain" x="8" y="77">van</text>

  <!-- The keyboard key makes the "space" in vanspace.dev literal. -->
  <g transform="translate(120 20)" aria-hidden="true">
    <rect x="3" y="5" width="276" height="68" rx="9" fill="#170073" opacity=".16" />
    <rect x="0" y="0" width="276" height="68" rx="9" fill="#e5e0cf" stroke="#170073" stroke-width="2.5" />
    <path d="M13 12H263" fill="none" stroke="#170073" stroke-linecap="round" stroke-opacity=".16" stroke-width="1.5" />
    <path d="M17 56H259" fill="none" stroke="#170073" stroke-linecap="round" stroke-opacity=".08" />
    <text class="key-label" x="140.5" y="42" text-anchor="middle">SPACE</text>
  </g>

  <text class="domain" x="419" y="77">.dev</text>
</svg>
