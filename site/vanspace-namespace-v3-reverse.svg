<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-labelledby="namespace-reverse-title namespace-reverse-desc">
  <title id="namespace-reverse-title">VAN:SPACE dot dev</title>
  <desc id="namespace-reverse-desc">Reverse white Van Space developer namespace logo for blue backgrounds.</desc>
  <style>
    .word {
      fill: #fff;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 82px;
      font-weight: 700;
      letter-spacing: -3.5px;
    }
    .suffix {
      fill: #fff;
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 18px;
      font-weight: 500;
