<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VanSpace Luma card — flagship</title>
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("./assets/IBMPlexMono-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("./assets/IBMPlexMono-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e7e5df; }
  .card {
    width: 1080px;
    height: 1080px;
    background: #f5f4f1;
    color: #191919;
    overflow: hidden;
  }
  .inner {
    height: 100%;
    padding: 68px 72px 56px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(25, 25, 25, 0.45);
  }
  .top .cog { height: 80px; width: auto; display: block; }
  .stage {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    margin: 20px 0 18px;
  }
  .stage .skybox {
    grid-area: 1 / 1;
    width: 100%;
    height: 100%;
    max-height: 420px;
    object-fit: contain;
    object-position: center center;
    display: block;
  }
  .overlay-logo {
    grid-area: 1 / 1;
    position: relative;
    z-index: 2;
    width: min(72%, 640px);
    height: auto;
    justify-self: center;
    align-self: center;
    transform: translateY(34%);
    pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(245, 244, 241, 0.9))
            drop-shadow(0 0 24px rgba(245, 244, 241, 0.95));
  }
  .bottom { flex-shrink: 0; }
  .rule {
    height: 1px;
    background: rgba(25, 25, 25, 0.14);
    margin-bottom: 20px;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 24px;
    letter-spacing: 0.03em;
  }
  .meta .slash { color: rgba(25, 25, 25, 0.3); }
  .lineup-label {
    margin-top: 22px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(25, 25, 25, 0.42);
  }
  .lineup {
    margin-top: 12px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lineup li {
    font-family: "IBM Plex Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: #191919;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: baseline;
  }
  .lineup .role {
    color: rgba(25, 25, 25, 0.45);
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .lineup .name { font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="top">
        <img class="cog" src="./assets/cognition-lockup.svg" alt="Cognition" />
        <span>Platinum</span>
      </div>
      <div class="stage">
        <img class="skybox" src="./assets/space-centre-sketch.jpg" alt="Space Centre" />
        <img class="overlay-logo" src="./assets/logo-wordmark.svg" alt="van space .dev" />
      </div>
      <div class="bottom">
        <div class="rule"></div>
        <div class="meta">
          <span>Date TBA</span>
          <span class="slash">/</span>
          <span>MacMillan Space Centre</span>
        </div>
        <p class="lineup-label">Line-up</p>
        <ul class="lineup">
          <li><span class="name">Kent C. Dodds</span><span class="role">Opening</span></li>
          <li><span class="name">Open stage</span><span class="role">TBA</span></li>
          <li><span class="name">Wes Bos</span><span class="role">Keynote</span></li>
          <li><span class="name">Cognition</span><span class="role">Closing</span></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
