<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VanSpace Luma card — light 1080</title>
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("./assets/IBMPlexMono-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("./assets/IBMPlexMono-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  @font-face {
    font-family: "PP Mori";
    src: url("./assets/PPMori-Semibold.otf") format("opentype");
    font-weight: 600;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e7e5df; }
  .card {
    width: 1080px;
    height: 1080px;
    background: #f5f4f1;
    color: #191919;
    font-family: "PP Mori", system-ui, sans-serif;
    overflow: hidden;
  }
  .inner {
    height: 100%;
    padding: 68px 72px 56px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(25, 25, 25, 0.45);
    flex-shrink: 0;
  }
  .top .cog {
    height: 80px;
    width: auto;
    display: block;
  }
  /* Image stage with overlaid spacebar */
  .stage {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    margin: 28px 0 24px;
  }
  .stage .skybox {
    grid-area: 1 / 1;
    width: 100%;
    height: 100%;
    max-height: 560px;
    object-fit: contain;
    object-position: center center;
    display: block;
  }
  .overlay-logo {
    grid-area: 1 / 1;
    position: relative;
    z-index: 2;
    width: min(72%, 640px);
    height: auto;
    justify-self: center;
    align-self: center;
    /* Spacebar = SVG center; drop down the building axis into the claw V */
    transform: translateY(34%);
    pointer-events: none;
    filter: drop-shadow(0 2px 0 rgba(245, 244, 241, 0.9))
            drop-shadow(0 0 24px rgba(245, 244, 241, 0.95));
  }
  /* Line-up removed (2026-08 direction) — more air for art + meta */
  .bottom {
    flex-shrink: 0;
    padding-bottom: 8px;
  }
  .rule {
    height: 1px;
    background: rgba(25, 25, 25, 0.14);
    margin-bottom: 20px;
  }
  .meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.03em;
  }
  .meta .slash { color: rgba(25, 25, 25, 0.3); }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="top">
        <span>VanSpace</span>
        <span>vanspace.dev</span>
      </div>
      <div class="stage">
        <img class="skybox" src="./assets/space-centre-sketch.jpg" alt="Space Centre" />
        <img class="overlay-logo" src="./assets/logo-wordmark.svg" alt="van space .dev" />
      </div>
      <div class="bottom">
        <div class="rule"></div>
        <div class="meta">
          <span>Date TBA</span>
          <span class="slash">/</span>
          <span>Science World · Vancouver</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
